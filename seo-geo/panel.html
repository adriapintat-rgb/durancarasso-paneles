<style>
:root{--navy:#0D3550;--gold:#B8922A;--bg:#FAF9F6;--card:#fff;--line:#ECE9E2;--txt:#1d2430;--mut:#7a7f89;--ok:#2e7d4f;--okl:#E9F4EC;--bad:#b4442f;--badl:#FBEDE9}

button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 80px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}

.sd .ok{color:var(--ok)}

.stats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mut);margin:0 0 6px}

.msg{padding:9px 12px;border-radius:12px;margin:6px 0;font-size:14px;white-space:pre-wrap}
.msg.yo{background:#EEF2F6;margin-left:40px}

<script>
/* Barra DC: «Modo oscuro» / «Modo claro», recordado en este navegador */
(function () {
  var r = document.documentElement, b = document.getElementById('dcTema');
  function oscuro() { var t = r.getAttribute('data-theme'); return t ? t === 'dark' : !!(window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches); }
  function rotulo() { b.textContent = oscuro() ? 'Modo claro' : 'Modo oscuro'; }
  b.addEventListener('click', function () { var t = oscuro() ? 'light' : 'dark'; r.setAttribute('data-theme', t); try { localStorage.setItem('dc-theme', t); } catch (e) {} rotulo(); });
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', rotulo); } catch (e) {}
  rotulo();
  /* Apps Script sirve el panel dentro de marcos de Google, no del Hub: el logo navega (target _top) en vez de quedarse en dc-barra.js */

<script>
var D = __DATOS__;
var NL = String.fromCharCode(10);
var SEDES = D.sedesInfo || [];
var NOMBRE = {}, PAGINA = {}; SEDES.forEach(function (s) { NOMBRE[s.code] = s.nombre; PAGINA[s.code] = s.pagina || ''; });
var BIZ = 'https://business.google.com/';
var MAX = 4;                 /* objetivos visibles por sede */
var GU = D.guias || {};      /* estado de los objetivos que salen de la revisión automática (sin propuesta) */
var SOL = {};                /* soluciones preparadas por la IA en esta sesión */
var actual = SEDES.length ? SEDES[0].code : '', OBJ = [], HECHOS = [];

function el(id) { return document.getElementById(id); }
function esc(t) { return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function toast(t) { var x = el('toast'); x.textContent = t; x.style.display = 'block'; clearTimeout(x._t); x._t = setTimeout(function () { x.style.display = 'none'; }, 3000); }
function sedesDe(it) { return String(it.sede || '').split(',').filter(String); }
function hecho(it) { return it.estado === 'HECHO'; }
function api(fn, args, ok, btn) {
  var txt = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Un momento…'; }
  var r = google.script.run.withSuccessHandler(function (x) { if (btn) { btn.disabled = false; btn.textContent = txt; } ok(x); })
    .withFailureHandler(function (e) { if (btn) { btn.disabled = false; btn.textContent = txt; } toast('No se pudo: ' + (e && e.message ? e.message : e)); });
  r[fn].apply(r, args);
}
function copiar(t) {
  var ok = function () { toast('Copiado'); };
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(ok, function () { viejo(t); }); } else viejo(t);
  function viejo(t) { var a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('Selecciona y pulsa Ctrl+C'); } a.remove(); }
}
function parteDetalle(d) {
  var o = { porque: '', pasos: [] }, modo = '';
  String(d || '').split(NL).forEach(function (l) {
    l = l.trim(); if (!l) return;
    if (l.indexOf('Por qué:') === 0) { o.porque = l.slice(8).trim(); modo = ''; }
    else if (l.indexOf('Cómo:') === 0) modo = 'p';
    else if (l.indexOf('Cuándo:') === 0) modo = '';
    else if (l.indexOf('Dónde:') === 0) o.pasos.push(l.slice(6).trim());
    else if (modo === 'p') o.pasos.push(l.replace(/^[0-9]+[.)] */, ''));
  });
  return o;
}

/* ── Qué toca en cada sede: lo que detecta la revisión + las propuestas de la IA, sin duplicados, máx. 4 ── */
function prio(it) { return it.prioridad === 'ALTA' ? 0 : it.prioridad === 'BAJA' ? 3 : 2; }
function tipoDe(t) {
  var s = String(t || '').toLowerCase();
  if (/reseñ|opini/.test(s)) return 'resenas';
  if (/foto|imagen/.test(s)) return 'fotos';
  if (/enlaz/.test(s)) return 'web';
  if (/llms|schema|meta ?desc|robots|hreflang|francés|velocidad|pagespeed|programador|la web|página web/.test(s)) return 'webdev';
  if (/nombre/.test(s)) return 'nombre';
  if (/teléfono/.test(s)) return 'telefono';
  if (/horario/.test(s)) return 'horario';
  return 'tarea';
}
function meta(x) {
  var arriba = (x.competencia || []).filter(function (c) { return c.resenas > x.resenas; }).sort(function (a, b) { return a.resenas - b.resenas; })[0];
  return arriba ? { n: arriba.resenas + 1, falta: arriba.resenas + 1 - x.resenas, quien: arriba.nombre } : null;
}
function catalan(code) { return /catal/i.test((D.sedes[code] || {}).idioma || '') || code === 'CRD' || code === 'AND'; }
function enlaces(t, code) { return String(t || '').split('[ENLACE]').join((D.sedes[code] || {}).resena || ''); }

function objetivos(code) {
  var x = D.sedes[code] || {}, f = x.falta || [], o = [], usadas = {};
  var mias = D.items.filter(function (i) { return sedesDe(i).indexOf(code) !== -1; });
  var tareas = mias.filter(function (i) { return i.tipo === 'TAREA'; });
  function tiene(c) { return f.indexOf(c) !== -1; }
  function guia(k, p, titulo, why, texto) {
    var it = k === 'webdev' ? null : tareas.filter(function (i) { return !usadas[i.id] && tipoDe(i.titulo) === k; })[0];   /* lo de la web puede ser cosas distintas: no se junta */
    if (it) usadas[it.id] = 1;
    if (it && it.estado === 'DESCARTADO') return;
    var key = code + '_' + k;
    if (!it && GU[key] === 'DESCARTADO') return;
    o.push({ key: it ? it.id : key, k: k, p: it ? Math.min(p, prio(it)) : p, it: it || null, titulo: titulo,
      why: why, texto: it && it.texto ? enlaces(it.texto, code) : texto || '', done: it ? hecho(it) : GU[key] === 'HECHO', pasos: it ? parteDetalle(it.detalle).pasos : [] });
  }
  if (tiene('Nombre sin palabras clave (riesgo de suspensión)'))
    guia('nombre', 0, 'Dejar el nombre de la ficha solo como «' + D.marca + '»', 'Ahora pone «' + (x.nombreFicha || '') + '». Las palabras clave en el nombre pueden hacer que Google suspenda la ficha.');
  if (tiene('Teléfono')) guia('telefono', 0, 'Poner el teléfono en la ficha', 'Google no muestra teléfono de esta oficina.');
  if (tiene('Web enlazada') || tiene('Enlazar la ficha a la página de la sede'))
    guia('web', 1, 'Enlazar la ficha a la página de ' + NOMBRE[code], 'Ahora lleva a ' + (x.web || 'ninguna web') + '. Si lleva a la página de la oficina, Google la entiende mejor.');
  var m = meta(x);
  if (m || tiene('Mínimo 30 reseñas') || tiene('Nota ≥ 4,5'))
    guia('resenas', 1, m ? 'Conseguir ' + m.falta + ' reseñas más' : 'Conseguir más reseñas',
      'Tenéis ' + x.resenas + ' (' + x.rating + '★).' + (m ? ' Con ' + m.n + ' pasáis a ' + m.quien + ' en Google Maps.' : ' Objetivo: 30 o más.'),
      enlaces(catalan(code) ? 'Hola, gràcies per confiar en ' + D.marca + '. Si tens un minut, ens ajudaria molt la teva opinió a Google: [ENLACE]'
        : 'Hola, gracias por confiar en ' + D.marca + '. Si tienes un minuto, nos ayudaría mucho tu opinión en Google: [ENLACE]', code));
  if (tiene('Horario')) guia('horario', 1, 'Añadir el horario en la ficha', 'Google no muestra cuándo está abierta la oficina.');
  if (tiene('Más fotos (fachada, oficina, equipo)'))
    guia('fotos', 2, 'Subir ' + Math.max(1, 10 - (x.fotos || 0)) + ' fotos', 'Tiene ' + (x.fotos || 0) + '. Las fichas con 10 o más reciben más visitas.');
  var web = ['Schema en la web', 'Meta description', 'Mismo teléfono en ficha y web'].filter(tiene);
  if (web.length) guia('webdev', 3, 'Mejorar la página de ' + NOMBRE[code] + ' en la web', 'Falta: ' + web.join(', ').toLowerCase() + '.');
  tareas.forEach(function (it) {
    if (usadas[it.id] || it.estado === 'DESCARTADO') return;
    var d = parteDetalle(it.detalle);
    o.push({ key: it.id, k: tipoDe(it.titulo), p: prio(it), it: it, titulo: it.titulo, why: d.porque, texto: enlaces(it.texto, code), done: hecho(it), pasos: d.pasos });
  });
  mias.forEach(function (it) {
    if (it.tipo === 'TAREA' || it.estado === 'DESCARTADO') return;
    if (it.tipo === 'NOTICIA') {   /* post a partir de una noticia del sector, con la fuente citada */
      var f = {};
      String(it.detalle || '').split(NL).forEach(function (l) { var j = l.indexOf(': '); if (j > 0) f[l.slice(0, j)] = l.slice(j + 2); });
      o.push({ key: it.id, k: 'noticia', p: 1.5, it: it, titulo: 'Noticia: ' + it.titulo, why: f['Por qué aquí'] || '', texto: it.texto || '', done: hecho(it), pasos: [],
        fuente: f['Fuente'] || '', enlace: f['Enlace'] || '', original: f['Titular original'] || '' });
      return;
    }
    var post = it.tipo === 'POST';
    o.push({ key: it.id, k: post ? 'post' : 'desc', p: 2, it: it, titulo: post ? 'Publicar la novedad de la semana' : 'Actualizar la descripción de la ficha',
      why: post ? 'Las fichas que publican cada semana salen más en Google Maps.' : 'La descripción actual tiene más de un mes.', texto: it.texto || '', done: hecho(it), pasos: [] });
  });
  o.forEach(function (x, i) { x.i = i; });
  o.sort(function (a, b) { return a.p - b.p || a.i - b.i; });
  return { pend: o.filter(function (x) { return !x.done; }).slice(0, MAX), hechos: o.filter(function (x) { return x.done; }) };
}

/* ── Pintar ── */
function pintaSedes() {
  el('sedes').innerHTML = SEDES.map(function (s) {
    var x = D.sedes[s.code] || {}, n = x.error ? -1 : objetivos(s.code).pend.length;
    var sub = n < 0 ? 'sin datos' : n ? n + ' por hacer' : '<span class="ok">✓ Al día</span>';
    return '<button class="sd' + (s.code === actual ? ' on' : '') + '" onclick="verSede(&quot;' + s.code + '&quot;)"><b>' + esc(s.nombre) + '</b><span>' + sub + '</span></button>';
  }).join('');
}
function solucion(o, i) {
  var code = actual, x = D.sedes[code] || {}, t = o.texto || SOL[o.key] || '';
  if (o.k === 'noticia') return '<div class="lab">Post a partir de la noticia · puedes editarlo</div><textarea id="tx' + i + '" rows="7">' + esc(t) + '</textarea>' +
    '<p class="mut">' + esc(o.fuente) + (o.original ? ' · «' + esc(o.original) + '»' : '') + (o.enlace ? ' · <a href="' + esc(o.enlace) + '" target="_blank">Leer la noticia ›</a>' : '') + '</p>';
  if (o.k === 'post' || o.k === 'desc') return '<div class="lab">' + (o.k === 'post' ? 'Publicación lista' : 'Descripción lista') + ' · puedes editarla</div><textarea id="tx' + i + '" rows="6">' + esc(t) + '</textarea>';
  if (o.k === 'resenas') return '<div class="lab">Mensaje para tus clientes · puedes editarlo</div><textarea id="tx' + i + '" rows="3">' + esc(t) + '</textarea>' +
    '<p class="mut">Envíalo a clientes contentos de las últimas operaciones, mejor justo después de firmar o entregar llaves.</p>';
  if (o.k === 'fotos') return D.apiGbp ? '<div class="up"><select id="cat' + i + '"><option value="EXTERIOR">Fachada</option><option value="INTERIOR">Oficina por dentro</option><option value="TEAMS">Equipo</option><option value="ADDITIONAL">Zona / otras</option></select>' +
    '<label class="bt">Elegir fotos y subir<input type="file" accept="image/jpeg,image/png" multiple onchange="subir(' + i + ',this)"></label></div>' +
    '<p class="mut" id="up' + i + '">Se suben directamente a la ficha de ' + esc(NOMBRE[code]) + '. Puedes elegir varias a la vez.</p>'
    : '<p class="mut">Fachada, oficina por dentro, equipo y la zona.</p>';
  if (o.k === 'web') return '<div class="lab">Enlace nuevo</div><div class="val">' + esc(PAGINA[code]) + '</div>';
  if (o.k === 'telefono') return '<div class="lab">Teléfono oficial</div><div class="val">' + esc(x.telOficial || '') + '</div>';
  if (o.k === 'nombre') return '<div class="lab">Nombre nuevo</div><div class="val">' + esc(D.marca) + '</div>';
  if (o.k === 'horario') return '<p class="mut">Se pone a mano en Google: 2 minutos.</p>';
  if (t) return '<div class="lab">' + (o.k === 'webdev' ? 'Solución para el programador' : 'Solución lista') + '</div><textarea id="tx' + i + '" rows="6">' + esc(t) + '</textarea>';
  return '<button class="bt lt" onclick="preparar(' + i + ',this)">Preparar la solución</button><p class="mut">La IA escribe el texto o el código listo para usar.</p>';
}
function botones(o, i) {
  var b = '', t = o.texto || SOL[o.key] || '';
  function p(txt, fn) { b += '<button class="bt" onclick="' + fn + '(' + i + ',this)">' + txt + '</button>'; }
  function s(txt, fn, cls) { b += '<button class="lk' + (cls ? ' ' + cls : '') + '" onclick="' + fn + '(' + i + ',this)">' + txt + '</button>'; }
  if (o.k === 'post' || o.k === 'desc' || o.k === 'noticia') { if (D.apiGbp) { p('Publicar en Google', 'publicar'); s('Copiar', 'copiarTx'); } else p('Copiar', 'copiarTx'); }
  else if (o.k === 'resenas') { p('Enviar por WhatsApp', 'whatsapp'); s('Copiar', 'copiarTx'); }
  else if (o.k === 'web') { if (D.apiGbp) p('Poner este enlace en Google', 'ponerWeb'); else p('Copiar', 'copiarVal'); }
  else if (o.k === 'telefono') { if (D.apiGbp) p('Poner este teléfono en Google', 'ponerTel'); else p('Copiar', 'copiarVal'); }
  else if (o.k === 'nombre') { if (D.apiGbp) p('Cambiar el nombre en Google', 'ponerNombre'); }
  else if (o.k === 'horario' || (o.k === 'fotos' && !D.apiGbp)) b += '<a class="bt" href="' + BIZ + '" target="_blank">Abrir mi ficha</a>';
  else if (t && o.k === 'webdev') { p('Enviar al programador', 'programador'); s('Copiar', 'copiarTx'); }
  else if (t) p('Copiar', 'copiarTx');
  if (o.it && o.k !== 'nombre' && o.k !== 'web' && o.k !== 'telefono' && o.k !== 'fotos' && o.k !== 'horario') s('Otra versión', 'otra');
  s('Ya está hecho', 'hecha', 'ok');
  s(o.k === 'nombre' ? 'Mantener el nombre actual' : 'Descartar', 'descartar');
  return b;
}
function card(o, i) {
  return '<li class="obj"><div class="oh"><span class="n">' + (i + 1) + '</span><div class="ob"><h3>' + esc(o.titulo) + '</h3>' +
    (o.why ? '<p class="why">' + esc(o.why) + '</p>' : '') + '</div>' + (o.p === 0 ? '<span class="tag">Urgente</span>' : '') + '</div>' +
    '<div class="sol">' + solucion(o, i) + '</div><div class="act">' + botones(o, i) + '</div>' +
    (o.pasos.length ? '<details class="man"><summary>Cómo hacerlo a mano</summary><ol>' + o.pasos.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol></details>' : '') + '</li>';
}
function pintaSede() {
  var code = actual, x = D.sedes[code] || {};
  if (x.error) { el('sede').innerHTML = '<p class="aviso">No se pudo analizar ' + esc(NOMBRE[code]) + ' esta semana: ' + esc(x.error) + '</p>'; return; }
  var r = objetivos(code); OBJ = r.pend; HECHOS = r.hechos;
  el('sede').innerHTML = '<div class="stats"><span><b>' + x.rating + '★</b> nota</span><span><b>' + x.resenas + '</b> reseñas</span><span><b>' + x.fotos + '</b> fotos</span>' +
    (x.maps ? '<a href="' + esc(x.maps) + '" target="_blank">Ver en Google Maps ›</a>' : '') + '</div>' +
    '<h2>' + (OBJ.length ? 'Esta semana en ' + esc(NOMBRE[code]) : esc(NOMBRE[code])) + '</h2>' +
    (OBJ.length ? '<ol class="objs">' + OBJ.map(card).join('') + '</ol>' : '<div class="vacio">✓ Todo al día en ' + esc(NOMBRE[code]) + '. El lunes llega la revisión nueva.</div>') +
    (HECHOS.length ? '<details class="hechas"><summary>Hecho esta semana · ' + HECHOS.length + '</summary><ul>' + HECHOS.map(function (o, j) {
      return '<li><span>' + esc(o.titulo) + '</span><button class="lk" onclick="deshacer(' + j + ',this)">Deshacer</button></li>'; }).join('') + '</ul></details>' : '');
}
function pinta() { pintaSedes(); pintaSede(); }

/* ── Acciones ── */
function verSede(c) { actual = c; pinta(); window.scrollTo(0, 0); }
function buscar(id) { return D.items.filter(function (i) { return i.id === id; })[0]; }
function actualiza(n) { var it = buscar(n.id); if (it) { it.estado = n.estado; it.titulo = n.titulo; it.detalle = n.detalle; it.texto = n.texto; } pinta(); }
function texto(i) { var t = el('tx' + i); return t ? t.value : (OBJ[i].texto || SOL[OBJ[i].key] || ''); }
function estado(o, est, btn, msg) {
  if (o.it) api('accionPanel', [D.clave, o.it.id, est === 'HECHO' ? 'hecho' : est === 'DESCARTADO' ? 'no' : 'pendiente'], function (n) { actualiza(n); toast(msg); }, btn);
  else api('marcarGuia', [D.clave, D.fecha, o.key, est], function (g) { GU = g || {}; pinta(); toast(msg); }, btn);
}
function hecha(i, b) { estado(OBJ[i], 'HECHO', b, 'Hecho ✓'); }
function descartar(i, b) {
  var o = OBJ[i];
  if (o.k === 'nombre' && !o.it) return api('ignorarObjetivo', [D.clave, 'nombre', true], function () { estado(o, 'DESCARTADO', null, 'Se mantiene el nombre actual'); }, b);
  estado(o, 'DESCARTADO', b, 'Descartado: no se volverá a proponer');
}
function deshacer(j, b) { estado(HECHOS[j], 'PENDIENTE', b, 'Vuelve a estar pendiente'); }
function copiarTx(i) { copiar(texto(i)); }
function copiarVal(i) { var o = OBJ[i]; copiar(o.k === 'web' ? PAGINA[actual] : (D.sedes[actual] || {}).telOficial || ''); }
function otra(i, b) { api('accionPanel', [D.clave, OBJ[i].it.id, 'otra'], function (n) { actualiza(n); toast('Nueva versión'); }, b); }
function publicar(i, b) {
  var o = OBJ[i], t = texto(i).trim();
  if (!t) return toast('El texto está vacío');
  if (!confirm('¿Publicar este texto en la ficha de Google de ' + NOMBRE[actual] + '? Lo verá todo el mundo.')) return;
  api('accionPanel', [D.clave, o.it.id, 'aplicar', t], function (n) { actualiza(n); toast('Publicado en Google ✓'); }, b);
}
function whatsapp(i) { window.open('https://wa.me/?text=' + encodeURIComponent(texto(i)), '_blank'); }
function programador(i) {
  var o = OBJ[i];
  window.open('mailto:?subject=' + encodeURIComponent(D.marca + ' · ' + o.titulo) + '&body=' + encodeURIComponent(o.titulo + NL + NL + texto(i)), '_blank');
}
function ficha(i, b, que, valor, pregunta) {
  if (!confirm(pregunta)) return;
  api('aplicarFicha', [D.clave, actual, que, valor], function (msg) { estado(OBJ[i], 'HECHO', null, msg || 'Cambiado en Google ✓'); }, b);
}
function ponerWeb(i, b) { ficha(i, b, 'web', PAGINA[actual], '¿Cambiar el enlace de la ficha de ' + NOMBRE[actual] + ' en Google a ' + PAGINA[actual] + '?'); }
function ponerTel(i, b) { var t = (D.sedes[actual] || {}).telOficial; ficha(i, b, 'telefono', t, '¿Poner el teléfono ' + t + ' en la ficha de ' + NOMBRE[actual] + '?'); }
function ponerNombre(i, b) {
  if (!confirm('¿Cambiar el nombre de la ficha de ' + NOMBRE[actual] + ' a «' + D.marca + '»? Google puede tardar unos días en validarlo.')) return;
  api('aplicarNombre', [D.clave, actual], function (msg) { estado(OBJ[i], 'HECHO', null, msg); }, b);
}
function preparar(i, b) {
  var o = OBJ[i];
  if (o.it) return api('accionPanel', [D.clave, o.it.id, 'solucion'], function (n) { actualiza(n); toast('Solución lista'); }, b);
  api('prepararSolucion', [D.clave, actual, o.titulo, o.why], function (t) { SOL[o.key] = t; pinta(); toast('Solución lista'); }, b);
}
/* Fotos: se reducen en el navegador (máx. 2000 px, JPEG) y se suben a la ficha una a una */
function foto(file, cb) {
  var r = new FileReader();
  r.onload = function () {
    var im = new Image();
    im.onload = function () {
      var k = Math.min(1, 2000 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      if (Math.min(c.width, c.height) < 250) return cb(null, 'es demasiado pequeña (mínimo 250 px)');
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      var u = c.toDataURL('image/jpeg', 0.86); cb(u.slice(u.indexOf(',') + 1));
    };
    im.onerror = function () { cb(null, 'no se puede leer'); };
    im.src = r.result;
  };
  r.readAsDataURL(file);
}
function subir(i, inp) {
  var files = [].slice.call(inp.files || []), cat = el('cat' + i).value, info = el('up' + i), ok = 0, mal = [], lbl = inp.parentNode;
  if (!files.length) return;
  lbl.style.opacity = '.55'; lbl.style.pointerEvents = 'none';
  function fin() {
    lbl.style.opacity = ''; lbl.style.pointerEvents = ''; inp.value = '';
    info.textContent = ok + ' de ' + files.length + ' subidas a Google' + (mal.length ? ' · ' + mal.join(' · ') : '') + '.';
    if (ok) toast(ok + (ok === 1 ? ' foto subida' : ' fotos subidas') + ' a Google ✓');
  }
  (function una(n) {
    if (n >= files.length) return fin();
    info.textContent = 'Subiendo ' + (n + 1) + ' de ' + files.length + '…';
    foto(files[n], function (b64, err) {
      if (!b64) { mal.push(files[n].name + ' ' + err); return una(n + 1); }
      google.script.run.withSuccessHandler(function () { ok++; una(n + 1); })
        .withFailureHandler(function (e) { mal.push(files[n].name + ': ' + (e && e.message ? e.message : e)); una(n + 1); })
        .subirFoto(D.clave, actual, b64, 'image/jpeg', cat);
    });
  })(0);
}
function chat(v) {
  el('chat').style.display = v ? 'flex' : 'none';
  if (v && !el('ms').innerHTML) {
    el('ms').innerHTML = '<div class="msg ia">Pregúntame lo que quieras sobre las fichas. Uso los datos de esta semana.</div>' +
      ['¿Qué es lo más urgente esta semana?', 'Escríbeme un WhatsApp para pedir reseñas', '¿Cómo vamos frente a la competencia?'].map(function (s) {
        return '<button class="sug" onclick="el(&quot;q&quot;).value=this.textContent;preguntar()">' + s + '</button>'; }).join('');
  }
  if (v) el('q').focus();
}
function preguntar(e) {
  if (e) e.preventDefault();
  var q = el('q').value.trim(); if (!q) return;
  var ms = el('ms'); el('q').value = '';
  ms.insertAdjacentHTML('beforeend', '<div class="msg yo">' + esc(q) + '</div><div class="msg ia">Pensando…</div>'); ms.scrollTop = ms.scrollHeight;
  var p = ms.lastElementChild;   /* cada respuesta va a su burbuja, aunque se hagan dos preguntas seguidas */
  google.script.run.withSuccessHandler(function (r) { p.textContent = r; ms.scrollTop = ms.scrollHeight; })
    .withFailureHandler(function (er) { p.textContent = 'No he podido responder: ' + (er && er.message ? er.message : er); })
    .preguntarIA(D.clave, q, actual);
}

el('ti').textContent = 'Semana del ' + (D.fecha || '');
if (D.errorIA) el('aviso').innerHTML = '<div class="aviso">La IA no respondió esta semana (' + esc(D.errorIA) + '). Lo que ves sale de la revisión automática.</div>';
var pri = SEDES.map(function (s) { return s.code; }).filter(function (c) { return !(D.sedes[c] || {}).error; })
  .sort(function (a, b) { return objetivos(b).pend.length - objetivos(a).pend.length; })[0];
if (pri) actual = pri;
pinta();
</script></body></html>
